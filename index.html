<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <title>Sanctum.exe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-easy" data-phase="1">
<header class="masthead">
  <a class="wordmark" href="./">SANCTUM<span>.exe</span></a>
  <button id="pause" class="quiet-button" disabled>Pause <kbd>Esc</kbd></button>
</header>
<main class="game">
  <aside class="entity-panel">
    <div class="portrait" id="boss">
      <img id="boss-image" src="easygab.png" alt="The Alternate">
    </div>
    <h1 id="bname">The Alternate</h1>
    <div class="health-label"><span>Boss</span><span id="hp-text">8 / 8</span></div>
    <div class="bar" id="health-bar" role="progressbar" aria-label="Boss health" aria-valuemin="0" aria-valuemax="8" aria-valuenow="8"><div id="hp"></div></div>
  </aside>
  <section class="arena-panel" aria-label="Game arena">
    <div class="arena-heading"><span id="phase">PHASE I / III</span><span id="wisps" aria-label="5 health remaining">●●●●●</span></div>
    <div class="stage">
      <svg id="board" viewBox="0 0 560 560" role="img" aria-label="Eight by eight arena. Move the ghost with arrow keys or WASD; avoid marked tiles, then press Space to strike the boss when the strike window opens.">
        <g id="tiles"></g><g id="warnings"></g><g id="flashes"></g><g id="spawns"></g><g id="items"></g><g id="projectiles"></g>
        <g id="ghost" transform="translate(280 420)">
          <ellipse cx="35" cy="60" rx="19" ry="5" fill="#000" opacity=".4"/>
          <path d="M16 31 A19 19 0 0 1 54 31 L54 55 L47 49 L41 55 L35 49 L29 55 L23 49 L16 55Z" fill="#a8a7a2" stroke="#17171b" stroke-width="2"/>
          <ellipse cx="28" cy="31" rx="3" ry="4" fill="#17171b"/><ellipse cx="42" cy="31" rx="3" ry="4" fill="#17171b"/>
        </g>
      </svg>
      <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title"></div>
      <div id="phase-notice" aria-live="polite"></div>
      <div id="strike-notice" aria-live="polite">STRIKE! <kbd>Space</kbd></div>
      <div id="countdown" aria-live="polite" hidden></div>
    </div>
    <div class="arena-meta">
      <div class="score-display"><span>Score</span><strong id="score">000000</strong></div>
      <div id="phrase-steps" aria-label="Attack sequence"></div>
    </div>
    <div class="touch-controls" aria-label="Movement">
      <button data-move="up" aria-label="Move up">↑</button>
      <div><button data-move="left" aria-label="Move left">←</button><button data-move="down" aria-label="Move down">↓</button><button data-move="right" aria-label="Move right">→</button></div>
      <button id="attack" class="attack-button" aria-label="Attack">Attack</button>
    </div>
  </section>
</main>
<div id="hurt-flash" aria-hidden="true"></div>
<div id="jumpscare" aria-hidden="true" hidden><img id="jumpscare-image" src="easygab.png" alt=""></div>
<script src="game.js"></script>
</body>
</html>
